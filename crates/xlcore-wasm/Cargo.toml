[package]
name = "xlcore-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for browser-side xlcore workbook extraction"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xlcore-io = { path = "../xlcore-io" }
xlcore-export = { path = "../xlcore-export" }
xlcore-tabular = { path = "../xlcore-tabular", features = ["parquet"] }
xlcore-api = { path = "../xlcore-api" }
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
