[workspace]
resolver = "2"
members = [
    "crates/xlcore-io",
    "crates/xlcore-export",
    "crates/xlcore-cli",
    "crates/xlcore-wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/m1a1/excel-spike"

[workspace.dependencies]
ooxmlsdk = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
# Used only by xlcore-export's opt-in `typescript` feature. Keeping it out of
# default CLI builds avoids expanding dozens of TS proc macros on every edit.
ts-rs = { version = "10", features = ["serde-compat", "import-esm"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
