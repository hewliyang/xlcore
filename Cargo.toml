[workspace]
resolver = "2"
members = [
    "crates/ironcalc-base",
    "crates/xlcore-io",
    "crates/xlcore-types",
    "crates/xlcore-export",
    "crates/xlcore-engine",
    "crates/xlcore-bridge",
    "crates/xlcore-api",
    "crates/xlcore-tabular",
    "crates/xlcore-cli",
    "crates/xlcore-wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/m1a1/excel-spike"

[workspace.dependencies]
# `mce` enables markup-compatibility (mc:AlternateContent) processing —
# required for chartEx (cx:) drawings, which Excel always wraps in an
# `mc:AlternateContent` block with the legacy chart as Fallback.
ooxmlsdk = { version = "0.10.2", features = ["mce"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
regex = "1"
ironcalc_base = { path = "crates/ironcalc-base" }
# Used only by opt-in `typescript` features. Keeping it out of default CLI
# builds avoids expanding TS proc macros on every edit.
ts-rs = { version = "10", features = ["serde-compat", "import-esm", "no-serde-warnings"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
