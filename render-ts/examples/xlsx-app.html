<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xlcore Excel app example</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #eef0f3; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { min-width: 0; padding: 10px 14px; background: #172033; color: #f9fafb; display: flex; align-items: center; gap: 12px; font-size: 13px; }
  header b { font-size: 14px; white-space: nowrap; }
  input[type=file] { color: #f9fafb; font: inherit; font-size: 12px; max-width: 260px; }
  #status { margin-left: auto; color: #d1d5db; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel-toggle { width: 32px; height: 28px; padding: 0; flex: none; border-color: #64748b; background: #243047; color: #f9fafb; }
  #panel-toggle:hover { background: #334155; }
  main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  body.panel-collapsed main { grid-template-columns: minmax(0, 1fr) 0; }
  #preview { min-width: 0; min-height: 0; border-right: 1px solid #cfd4dc; }
  body.panel-collapsed #preview { border-right: 0; }
  aside { min-height: 0; overflow: auto; background: #f8fafc; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  body.panel-collapsed aside { padding: 0; overflow: hidden; border: 0; }
  body.panel-collapsed aside > * { display: none; }
  section { display: grid; gap: 8px; }
  h2 { margin: 0; font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0; }
  .row { display: flex; gap: 8px; align-items: center; min-width: 0; }
  button, select, input[type=text], input[type=number] { height: 32px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #111827; font: inherit; font-size: 13px; }
  button { padding: 0 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #f1f5f9; }
  button:disabled, select:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
  select, input[type=text], input[type=number] { min-width: 0; padding: 0 8px; }
  #address { flex: 1; }
  #sheet-select { width: 100%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .state { margin: 0; padding: 10px; min-height: 116px; overflow: auto; background: #111827; color: #e5e7eb; border-radius: 6px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  #loading { position: fixed; inset: 43px 320px 0 0; z-index: 10; display: grid; place-items: center; background: rgba(238,240,243,0.9); }
  body.panel-collapsed #loading { right: 0; }
  #loading[hidden] { display: none; }
  .loading-box { min-width: 280px; padding: 20px 24px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; box-shadow: 0 12px 28px rgba(15,23,42,0.12); }
  .loading-title { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
  .loading-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #4b5563; }
  .spinner { width: 16px; height: 16px; border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 999px; animation: spin 0.8s linear infinite; flex: none; }
  #loading-elapsed { margin-top: 8px; font-size: 11px; color: #6b7280; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) auto; }
    body.panel-collapsed main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 0; }
    #preview { border-right: 0; border-bottom: 1px solid #cfd4dc; }
    body.panel-collapsed #preview { border-bottom: 0; }
    aside { max-height: 45vh; }
    #loading { inset: 43px 0 45vh 0; }
    body.panel-collapsed #loading { inset: 43px 0 0 0; }
  }
</style>
</head>
<body>
<header>
  <b>xlcore app bindings</b>
  <input type="file" id="picker" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  <span id="status">Load an .xlsx file</span>
  <button id="panel-toggle" type="button" aria-label="Collapse side panel" aria-expanded="true">›</button>
</header>
<main>
  <div id="preview"></div>
  <aside>
    <section>
      <h2>Selection</h2>
      <div class="row">
        <input id="address" type="text" value="C5" aria-label="Cell address">
        <button id="go-cell">Go</button>
      </div>
      <div class="grid2">
        <button data-cell="A1">A1</button>
        <button data-cell="C5">C5</button>
        <button data-cell="F12">F12</button>
        <button data-range="B2:E8">B2:E8</button>
      </div>
    </section>
    <section>
      <h2>Sheets</h2>
      <select id="sheet-select" disabled></select>
    </section>
    <section>
      <h2>Viewport</h2>
      <div class="grid2">
        <button id="zoom-out">Zoom -</button>
        <button id="zoom-in">Zoom +</button>
        <button id="scroll-active">Scroll active</button>
        <button id="reset-view">Reset view</button>
      </div>
    </section>
    <section>
      <h2>Live state</h2>
      <pre id="state" class="state">No workbook loaded</pre>
    </section>
  </aside>
</main>
<div id="loading" role="status" aria-live="polite" hidden>
  <div class="loading-box">
    <p class="loading-title">Loading workbook...</p>
    <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span id="loading-stage">Loading preview</span></div>
    <div id="loading-elapsed">0.0s elapsed</div>
  </div>
</div>

<script type="module">
import { createWorkbookPreviewerFromFile } from "https://pub-5694368c6d1d48138a9b3c2a0829b544.r2.dev/xlcore-preview/v0.0.1/browser-loader.js";

const CDN = "https://pub-5694368c6d1d48138a9b3c2a0829b544.r2.dev/xlcore-preview/v0.0.1/";
const picker = document.getElementById("picker");
const status = document.getElementById("status");
const previewRoot = document.getElementById("preview");
const panelToggle = document.getElementById("panel-toggle");
const sheetSelect = document.getElementById("sheet-select");
const stateBox = document.getElementById("state");
const address = document.getElementById("address");
const loading = document.getElementById("loading");
const loadingStage = document.getElementById("loading-stage");
const loadingElapsed = document.getElementById("loading-elapsed");
let previewer = null;
let elapsedTimer = null;

panelToggle.addEventListener("click", () => {
  const collapsed = document.body.classList.toggle("panel-collapsed");
  panelToggle.textContent = collapsed ? "‹" : "›";
  panelToggle.setAttribute("aria-label", collapsed ? "Expand side panel" : "Collapse side panel");
  panelToggle.setAttribute("aria-expanded", String(!collapsed));
  requestAnimationFrame(() => previewer?.redraw());
});

function setStatus(text) {
  status.textContent = text;
}

function setLoadingStage(text) {
  loadingStage.textContent = text;
  setStatus(text);
}

function startLoading() {
  const started = performance.now();
  loading.hidden = false;
  clearInterval(elapsedTimer);
  loadingElapsed.textContent = "0.0s elapsed";
  elapsedTimer = setInterval(() => {
    loadingElapsed.textContent = `${((performance.now() - started) / 1000).toFixed(1)}s elapsed`;
  }, 100);
  return started;
}

function finishLoading() {
  clearInterval(elapsedTimer);
  elapsedTimer = null;
  loading.hidden = true;
}

function renderState() {
  if (!previewer) {
    stateBox.textContent = "No workbook loaded";
    return;
  }
  const state = previewer.getState();
  const sheet = previewer.getActiveSheet();
  stateBox.textContent = JSON.stringify({
    sheet: sheet.name,
    sheetIndex: state.activeSheetIndex,
    activeCell: formatCell(state.activeCell.r, state.activeCell.c),
    selection: formatSelection(state.selection),
    zoom: `${Math.round(state.zoom * 100)}%`,
  }, null, 2);
}

function populateSheets() {
  sheetSelect.replaceChildren();
  if (!previewer) {
    sheetSelect.disabled = true;
    return;
  }
  previewer.layout.sheets.forEach((sheet, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = sheet.name;
    sheetSelect.append(option);
  });
  sheetSelect.value = String(previewer.getActiveSheetIndex());
  sheetSelect.disabled = false;
}

function parseCell(value) {
  const match = String(value).trim().match(/^([A-Za-z]+)(\d+)$/);
  if (!match) throw new Error(`Invalid cell address: ${value}`);
  return { c: colNumber(match[1]), r: Number(match[2]) };
}

function parseRange(value) {
  const [a, b] = String(value).split(":");
  const start = parseCell(a);
  const end = parseCell(b || a);
  return { r1: start.r, c1: start.c, r2: end.r, c2: end.c };
}

function colNumber(label) {
  let n = 0;
  for (const ch of label.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n;
}

function colLabel(n) {
  let out = "";
  let cur = n;
  while (cur > 0) {
    const r = (cur - 1) % 26;
    out = String.fromCharCode(65 + r) + out;
    cur = Math.floor((cur - 1) / 26);
  }
  return out;
}

function formatCell(r, c) {
  return `${colLabel(c)}${r}`;
}

function formatSelection(selection) {
  const start = formatCell(selection.r1, selection.c1);
  const end = formatCell(selection.r2, selection.c2);
  return start === end ? start : `${start}:${end}`;
}

function requirePreviewer() {
  if (!previewer) throw new Error("Load a workbook first");
  return previewer;
}

picker.addEventListener("change", async () => {
  const file = picker.files && picker.files[0];
  if (!file) return;
  const started = startLoading();
  try {
    previewer?.destroy();
    previewRoot.replaceChildren();
    previewer = await createWorkbookPreviewerFromFile(previewRoot, file, {
      wasmUrl: `${CDN}xlcore_wasm.js`,
      workerUrl: `${CDN}xlsxWorker.js`,
      onProgress: ({ label }) => setLoadingStage(label),
    });
    window.xlcorePreviewer = previewer;
    previewer.on("selectionchange", renderState);
    previewer.on("sheetchange", () => {
      sheetSelect.value = String(previewer.getActiveSheetIndex());
      renderState();
    });
    previewer.on("zoomchange", renderState);
    populateSheets();
    renderState();
    requestAnimationFrame(finishLoading);
    setStatus(`${file.name} · ${previewer.layout.sheets.length} sheet(s) · ${((performance.now() - started) / 1000).toFixed(1)}s`);
  } catch (error) {
    console.error(error);
    finishLoading();
    setStatus(error && error.message ? error.message : String(error));
  }
});

document.getElementById("go-cell").addEventListener("click", () => {
  try {
    const cell = parseCell(address.value);
    requirePreviewer().selectCell(cell.r, cell.c, { scroll: true });
    renderState();
  } catch (error) {
    setStatus(error.message || String(error));
  }
});

document.querySelectorAll("[data-cell]").forEach((button) => {
  button.addEventListener("click", () => {
    const cell = parseCell(button.dataset.cell);
    address.value = button.dataset.cell;
    requirePreviewer().selectCell(cell.r, cell.c, { scroll: true });
    renderState();
  });
});

document.querySelectorAll("[data-range]").forEach((button) => {
  button.addEventListener("click", () => {
    requirePreviewer().selectRange(parseRange(button.dataset.range), { scroll: true });
    renderState();
  });
});

sheetSelect.addEventListener("change", () => {
  requirePreviewer().setActiveSheet(Number(sheetSelect.value));
  renderState();
});

document.getElementById("zoom-out").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setZoom(p.getZoom() - 0.25);
  renderState();
});

document.getElementById("zoom-in").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setZoom(p.getZoom() + 0.25);
  renderState();
});

document.getElementById("scroll-active").addEventListener("click", () => {
  const p = requirePreviewer();
  const cell = p.getActiveCell();
  p.scrollToCell(cell.r, cell.c);
  renderState();
});

document.getElementById("reset-view").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setActiveSheet(0);
  p.setZoom(1);
  p.selectCell(1, 1, { scroll: true });
  renderState();
});
</script>
</body>
</html>
