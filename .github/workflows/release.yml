name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC). The `id-token: write`
  # scope lets the npm CLI exchange a GitHub Actions JWT for an npm
  # publish token at runtime — no NODE_AUTH_TOKEN needed. Trusted
  # publishing must be configured on npmjs.com for the package first.
  id-token: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24 ships npm >= 11.5.1, the minimum for npm trusted
      # publishing via GitHub Actions OIDC. CI runs on Node 20 (the
      # consumer floor); this job is the only place we need 24.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm
        run: wasm-pack build crates/xlcore-wasm --target web --out-dir pkg --profile wasm-size --no-opt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @hewliyang/xlsx-preview build

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" packages/xlsx-preview/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog entry found for ${VERSION}, falling back to Unreleased"
            NOTES=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' packages/xlsx-preview/CHANGELOG.md)
          fi
          echo "$NOTES" > /tmp/release-notes.md

      # No NODE_AUTH_TOKEN: OIDC trusted publishing kicks in
      # automatically when `id-token: write` is granted and the package
      # is configured for trusted publishing on npmjs.com.
      - name: Publish to npm
        working-directory: packages/xlsx-preview
        run: npm publish --access public --provenance --tag latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
