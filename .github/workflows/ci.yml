name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm
        run: wasm-pack build crates/xlcore-wasm --target web --out-dir pkg --profile wasm-size --no-opt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @hewliyang/xlsx-preview typecheck

      - name: Lint
        run: pnpm --filter @hewliyang/xlsx-preview lint

      - name: Build
        run: pnpm --filter @hewliyang/xlsx-preview build

      - name: Test (node)
        run: pnpm --filter @hewliyang/xlsx-preview test

      - name: Test (rust workspace)
        run: cargo test --workspace --release
