name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # `latest` currently resolves to the old v0.9.1 release in this action,
          # which does not support `wasm-pack build --profile`.
          version: v0.14.0

      - name: Build wasm
        run: wasm-pack build crates/xlcore-wasm --target web --out-dir pkg --profile wasm-size --no-opt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: a test file imports from ../dist/index.js so it can
      # pick up the wasm sitting alongside the built node entry. tsc and
      # vitest both need dist/ present.
      - name: Build
        run: pnpm --filter @hewliyang/xlsx-preview build

      - name: Type check
        run: pnpm --filter @hewliyang/xlsx-preview typecheck

      - name: Lint
        run: pnpm --filter @hewliyang/xlsx-preview lint

      - name: Test (node)
        run: pnpm --filter @hewliyang/xlsx-preview test

      - name: Test (rust workspace)
        run: cargo test --workspace --release

      - name: Schema drift guard
        run: |
          ./scripts/regen-schema.sh
          git diff --exit-code packages/xlsx-preview/src/schema/
