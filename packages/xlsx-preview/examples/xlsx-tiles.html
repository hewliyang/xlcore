<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xlcore tiles · multi-workbook</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  /* --- tokens ------------------------------------------------------- */
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-muted: #f4f6f8;
    --border: #e4e7eb;
    --border-strong: #d4d8de;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --accent: #4f46e5;
    --danger: #dc2626;
    --radius-sm: 4px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px var(--font);
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
  }

  header {
    height: 34px;
    padding: 0 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  header b { font-size: 12px; font-weight: 600; }
  header .hint { color: var(--text-muted); font-size: 11.5px; }
  header .sep { width: 1px; height: 16px; background: var(--border); flex: none; }
  header button {
    height: 22px; padding: 0 8px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    font: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer;
  }
  header button:hover { background: var(--surface-muted); }
  .spacer { flex: 1; }

  /* --- tile tree ---------------------------------------------------- */
  #root-tile { display: flex; min-width: 0; min-height: 0; }
  .split {
    display: flex; min-width: 0; min-height: 0;
    width: 100%; height: 100%;
  }
  .split.vertical { flex-direction: column; }
  .split.horizontal { flex-direction: row; }
  .split > .pane-host { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }

  /* Split.js gutter styling */
  .gutter {
    background: var(--border);
    background-repeat: no-repeat;
    background-position: 50%;
    flex: none;
    transition: background 0.12s;
  }
  .gutter:hover { background: var(--accent); }
  .gutter.gutter-horizontal { cursor: col-resize; width: 4px; }
  .gutter.gutter-vertical { cursor: row-resize; height: 4px; }

  /* --- leaf pane ---------------------------------------------------- */
  .pane {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--surface);
    min-width: 0; min-height: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  .pane-head {
    height: 26px;
    padding: 0 6px 0 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px;
    background: #fafbfc;
  }
  .pane-head { cursor: grab; user-select: none; }
  .pane-head:active { cursor: grabbing; }
  .pane-head button { cursor: pointer; }
  .pane-head .name { color: var(--text); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .meta { color: var(--text-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .actions { display: flex; gap: 2px; flex: none; }
  .pane-head .icon-btn {
    width: 20px; height: 20px; padding: 0;
    border: 1px solid transparent; border-radius: 3px;
    background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 11px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pane-head .icon-btn:hover { background: var(--surface-muted); color: var(--text); border-color: var(--border); }
  .pane-head .icon-btn.danger:hover { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
  .pane-body {
    min-width: 0; min-height: 0; position: relative;
    overflow: hidden;
  }
  .pane-body.empty {
    display: grid; place-items: center;
    color: var(--text-dim);
    background: repeating-linear-gradient(45deg, #fafbfc 0 8px, #f4f6f8 8px 16px);
    cursor: pointer;
  }
  .pane-body.empty .empty-inner { text-align: center; font-size: 11.5px; pointer-events: none; }
  .pane-body.empty .empty-inner b { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .pane-body.empty input { position: absolute; left: -9999px; }
  /* Drag-over affordance: light accent tint covers the whole pane body
     (empty or already-loaded — dropping onto a loaded pane replaces its
     workbook). The overlay is pointer-events:none so the underlying drop
     target keeps receiving the event. */
  .pane-body.drop-target::after {
    content: "Drop to load";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(79, 70, 229, 0.08);
    border: 2px dashed var(--accent);
    color: var(--accent);
    font-weight: 600; font-size: 13px;
    pointer-events: none;
    z-index: 5;
  }
  /* Pane-rearrange drop zones: shown when another pane's header is being
     dragged over this body. The overlay rectangle previews where the
     dragged pane will land (left/right/top/bottom half = insert as a
     sibling on that edge; center = swap positions). */
  .pane-body[data-pane-zone]::before {
    content: "";
    position: absolute;
    background: rgba(79, 70, 229, 0.18);
    border: 2px solid var(--accent);
    pointer-events: none;
    z-index: 6;
    transition: inset 0.08s ease;
  }
  .pane-body[data-pane-zone="left"]::before   { inset: 0 50% 0 0; }
  .pane-body[data-pane-zone="right"]::before  { inset: 0 0 0 50%; }
  .pane-body[data-pane-zone="top"]::before    { inset: 0 0 50% 0; }
  .pane-body[data-pane-zone="bottom"]::before { inset: 50% 0 0 0; }
  .pane-body[data-pane-zone="center"]::before { inset: 0; background: rgba(79, 70, 229, 0.28); }
  .pane.dragging { opacity: 0.6; }
  /* The previewer renders its own formula bar + sheet tab strip. We
     hide both: the formula bar to save vertical space in small tiles,
     and the built-in tabs because we render our own footer below
     (matching the look in xlsx-app.html). */
  .pane-body .xlcore-formula-bar,
  .pane-body .xlcore-tabs { display: none !important; }

  /* --- per-pane sheet tab bar (footer) ----------------------------- */
  /* Cloned from xlsx-app.html. Lives inside each leaf pane. */
  .tabbar {
    height: 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: stretch;
    min-width: 0;
  }
  .tabbar .tabs {
    flex: 1 1 auto;
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    padding: 0 6px;
    min-width: 0;
  }
  .tabbar .tabs::-webkit-scrollbar { height: 6px; }
  .tabbar .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .tabbar .tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 100%;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.12s, background 0.12s;
  }
  .tabbar .tab:hover { color: var(--text); background: var(--surface-muted); }
  .tabbar .tab.active { color: var(--accent); font-weight: 600; }
  .tabbar .tab.active::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px; bottom: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }
  .tabbar .right {
    flex: none;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 6px;
    border-left: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .tabbar .icon-btn {
    width: 22px; height: 22px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tabbar .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
  .tabbar .zoom-label {
    min-width: 36px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .tabbar.empty { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<header>
  <b>xlcore · tiles</b>
  <span class="hint">Each pane is independent. Use ⇢ / ⇣ to split, ✕ to close. Drag the gutters to resize.</span>
  <span class="spacer"></span>
  <button id="reset">Reset layout</button>
</header>
<div id="root-tile"></div>

<script src="https://unpkg.com/split.js@1.6.5/dist/split.min.js"></script>
<script type="module">
const REMOTE_CDN = "https://cdn.jsdelivr.net/npm/@hewliyang/xlsx-preview@0.0.5/dist/";
let ASSET_BASE = "../dist/";
let createWorkbookPreviewerFromFile;
try {
  ({ createWorkbookPreviewerFromFile } = await import(`../dist/browserLoader.js?v=${Date.now()}`));
} catch (error) {
  console.warn("Local renderer failed; falling back to CDN", error);
  ASSET_BASE = REMOTE_CDN;
  ({ createWorkbookPreviewerFromFile } = await import(`${REMOTE_CDN}browserLoader.js`));
}

const root = document.getElementById("root-tile");

// ----- tile tree --------------------------------------------------------
//
// Each tile is either a leaf (with an optional loaded workbook) or a
// split that contains exactly two children plus a Split.js instance for
// drag-resize between them. The tree is mutated in place: splitting a
// leaf replaces it with a Split node whose first child holds the
// original leaf and whose second child is a fresh empty leaf. Closing a
// leaf finds its parent split and replaces the parent with the surviving
// sibling — exactly how tmux/zellij pane-close works.

let nextId = 1;
function uid() { return `t${nextId++}`; }

// Custom MIME used by the pane-rearrange drag-and-drop. Drop targets
// look for this type to distinguish an internal move from an external
// .xlsx file drop. Note: most browsers normalise the type to lowercase
// when it's read back via `dataTransfer.types`, so we use a lowercase
// canonical form everywhere.
const PANE_MIME = "application/x-xlcore-pane";

/**
 * @typedef {Object} Leaf
 * @property {"leaf"} kind
 * @property {string} id
 * @property {HTMLElement} el        // .pane element
 * @property {HTMLElement} bodyEl    // .pane-body
 * @property {HTMLElement} nameEl
 * @property {HTMLElement} metaEl
 * @property {any|null} previewer    // WorkbookPreviewer | null
 * @property {Split|null} parentSplit
 * @property {Object|null} parent
 */
/**
 * @typedef {Object} Split
 * @property {"split"} kind
 * @property {"horizontal"|"vertical"} direction
 * @property {HTMLElement} el        // .split element
 * @property {[Object, Object]} children // each child has .host (pane-host wrapper)
 * @property {[HTMLElement, HTMLElement]} hosts
 * @property {any} instance          // Split.js instance
 * @property {Object|null} parent
 */

let rootNode = null;

function createLeaf() {
  const el = document.createElement("div");
  el.className = "pane";
  el.dataset.id = uid();

  const head = document.createElement("div");
  head.className = "pane-head";
  const idEl = document.createElement("span");
  idEl.className = "meta";
  idEl.style.cssText = "flex:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;opacity:.5;";
  idEl.textContent = el.dataset.id;
  const nameEl = document.createElement("span");
  nameEl.className = "name";
  nameEl.textContent = "Empty";
  const metaEl = document.createElement("span");
  metaEl.className = "meta";
  metaEl.textContent = "no workbook";
  const actions = document.createElement("span");
  actions.className = "actions";
  const splitRight = iconBtn("⇢", "Split right");
  const splitDown = iconBtn("⇣", "Split down");
  const closeBtn = iconBtn("✕", "Close pane");
  closeBtn.classList.add("danger");
  actions.append(splitRight, splitDown, closeBtn);
  head.append(idEl, nameEl, metaEl, actions);

  const body = document.createElement("div");
  body.className = "pane-body empty";
  const fileId = `file-${el.dataset.id}`;
  body.innerHTML = `
    <label for="${fileId}" class="empty-inner">
      <b>Drop or click to load</b>
      <span>any .xlsx file</span>
      <input type="file" id="${fileId}" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </label>`;

  // Per-pane footer (sheet tabs + zoom controls). Cloned from
  // xlsx-app.html — each leaf owns its own tabbar wired to its own
  // previewer instance. Starts in the "empty" state until a workbook
  // is loaded.
  const tabbar = document.createElement("footer");
  tabbar.className = "tabbar empty";
  const tabs = document.createElement("div");
  tabs.className = "tabs";
  tabs.setAttribute("role", "tablist");
  const right = document.createElement("div");
  right.className = "right";
  const zoomOut = document.createElement("button");
  zoomOut.type = "button";
  zoomOut.className = "icon-btn";
  zoomOut.title = "Zoom out";
  zoomOut.textContent = "−";
  const zoomLabel = document.createElement("span");
  zoomLabel.className = "zoom-label";
  zoomLabel.textContent = "100%";
  const zoomIn = document.createElement("button");
  zoomIn.type = "button";
  zoomIn.className = "icon-btn";
  zoomIn.title = "Zoom in";
  zoomIn.textContent = "+";
  right.append(zoomOut, zoomLabel, zoomIn);
  tabbar.append(tabs, right);

  el.append(head, body, tabbar);

  /** @type {Leaf} */
  const leaf = {
    kind: "leaf",
    id: el.dataset.id,
    el,
    bodyEl: body,
    nameEl,
    metaEl,
    tabbarEl: tabbar,
    tabsEl: tabs,
    zoomLabelEl: zoomLabel,
    previewer: null,
    parent: null,
  };

  zoomOut.onclick = () => {
    if (!leaf.previewer) return;
    leaf.previewer.setZoom(leaf.previewer.getZoom() - 0.25);
  };
  zoomIn.onclick = () => {
    if (!leaf.previewer) return;
    leaf.previewer.setZoom(leaf.previewer.getZoom() + 0.25);
  };

  splitRight.onclick = () => splitLeaf(leaf, "horizontal");
  splitDown.onclick = () => splitLeaf(leaf, "vertical");
  closeBtn.onclick = () => closeLeaf(leaf);

  // The pane head doubles as a drag handle: dragging it onto another
  // pane re-parents this leaf in the tree (see moveLeaf). We tag the
  // dataTransfer with a custom MIME type so drop targets can tell
  // pane-rearrange drags apart from external file drops.
  head.draggable = true;
  head.addEventListener("dragstart", (e) => {
    // Action buttons inside the head shouldn't initiate a move drag.
    if (e.target instanceof Element && e.target.closest("button")) {
      e.preventDefault();
      return;
    }
    e.dataTransfer.setData(PANE_MIME, leaf.id);
    e.dataTransfer.effectAllowed = "move";
    leaf.el.classList.add("dragging");
  });
  head.addEventListener("dragend", () => {
    leaf.el.classList.remove("dragging");
    // Any zone overlays still showing (e.g. drag cancelled outside any
    // pane) should be cleared.
    for (const b of document.querySelectorAll(".pane-body[data-pane-zone]")) {
      b.removeAttribute("data-pane-zone");
    }
  });
  body.querySelector("input").addEventListener("change", (e) => {
    const files = Array.from(e.target.files ?? []);
    if (files.length) loadFiles(leaf, files);
    e.target.value = "";
  });
  wireDropZone(leaf);

  return leaf;
}

/** Wire native drag-and-drop on a leaf's body. Handles two drag kinds:
 *  (1) external `.xlsx` files dragged from the OS — load them into
 *      this slot via loadFiles (splits if the slot already holds a
 *      workbook), and (2) an internal pane-rearrange drag where the
 *      user grabbed another pane's header — show a directional drop
 *      overlay (left/right/top/bottom/center) and on drop call
 *      moveLeaf to re-home the source leaf in this slot. */
function wireDropZone(leaf) {
  const body = leaf.bodyEl;
  let fileDepth = 0; // dragenter/dragleave fire per child, so we ref-count.
  const isXlsx = (f) =>
    f && (
      /\.xlsx$/i.test(f.name) ||
      f.type === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    );
  const isPaneDrag = (types) => types?.includes(PANE_MIME);
  const isFileDrag = (types) => types?.includes("Files");

  body.addEventListener("dragenter", (e) => {
    const types = e.dataTransfer?.types;
    if (isFileDrag(types)) {
      e.preventDefault();
      fileDepth++;
      body.classList.add("drop-target");
    } else if (isPaneDrag(types)) {
      e.preventDefault();
      // Zone overlay is computed in dragover (needs pointer coords).
    }
  });
  body.addEventListener("dragover", (e) => {
    const types = e.dataTransfer?.types;
    if (isPaneDrag(types)) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const zone = computeZone(body, e.clientX, e.clientY);
      if (body.dataset.paneZone !== zone) body.dataset.paneZone = zone;
    } else if (isFileDrag(types)) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    }
  });
  body.addEventListener("dragleave", (e) => {
    const types = e.dataTransfer?.types;
    if (isFileDrag(types)) {
      fileDepth = Math.max(0, fileDepth - 1);
      if (fileDepth === 0) body.classList.remove("drop-target");
    }
    if (isPaneDrag(types)) {
      // dragleave fires when the pointer crosses into a child element
      // too, but in that case a fresh dragenter follows immediately and
      // re-sets the attribute via dragover. Safe to clear here; if the
      // pointer is still over the body it'll be set again on the next
      // dragover frame.
      const r = body.getBoundingClientRect();
      if (
        e.clientX < r.left || e.clientX >= r.right ||
        e.clientY < r.top || e.clientY >= r.bottom
      ) {
        delete body.dataset.paneZone;
      }
    }
  });
  body.addEventListener("drop", (e) => {
    const types = e.dataTransfer?.types;

    // Pane-rearrange drop: re-home the source leaf relative to this one.
    if (isPaneDrag(types)) {
      e.preventDefault();
      e.stopPropagation();
      const sourceId = e.dataTransfer.getData(PANE_MIME);
      const zone = body.dataset.paneZone ?? computeZone(body, e.clientX, e.clientY);
      delete body.dataset.paneZone;
      const sourceLeaf = findLeafById(rootNode, sourceId);
      if (sourceLeaf && sourceLeaf !== leaf) moveLeaf(sourceLeaf, leaf, zone);
      return;
    }

    // External file drop.
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    e.stopPropagation();
    fileDepth = 0;
    body.classList.remove("drop-target");
    const files = Array.from(e.dataTransfer.files).filter(isXlsx);
    if (files.length) loadFiles(leaf, files);
    else leaf.metaEl.textContent = "not an .xlsx file";
  });
}

/** Bucket a pointer position inside `body` into one of five drop zones.
 *  The central rectangle (30%–70% on both axes) is "center" → swap;
 *  outside that it falls to the nearest edge. */
function computeZone(body, clientX, clientY) {
  const r = body.getBoundingClientRect();
  const fx = (clientX - r.left) / Math.max(1, r.width);
  const fy = (clientY - r.top) / Math.max(1, r.height);
  if (fx >= 0.3 && fx <= 0.7 && fy >= 0.3 && fy <= 0.7) return "center";
  const dl = fx, dr = 1 - fx, dt = fy, db = 1 - fy;
  const m = Math.min(dl, dr, dt, db);
  if (m === dl) return "left";
  if (m === dr) return "right";
  if (m === dt) return "top";
  return "bottom";
}

/** Walk the tree, return the leaf whose id matches. */
function findLeafById(node, id) {
  if (!node) return null;
  if (node.kind === "leaf") return node.id === id ? node : null;
  for (const c of node.children) {
    const hit = findLeafById(c, id);
    if (hit) return hit;
  }
  return null;
}

// Suppress the browser default of opening dropped files when the drop
// lands outside any pane body (otherwise the user navigates away).
window.addEventListener("dragover", (e) => {
  if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
});
window.addEventListener("drop", (e) => {
  if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
});

function iconBtn(label, title) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "icon-btn";
  b.title = title;
  b.setAttribute("aria-label", title);
  b.textContent = label;
  return b;
}

/** Load N files starting from `startLeaf`. The drop target itself
 *  takes the first file (if empty) or is split to make room. Extra
 *  files cascade: each one splits the leaf the previous file landed
 *  in. Split direction is perpendicular to the target leaf's longest
 *  side, so a wide pane cuts left/right and a tall pane cuts
 *  top/bottom — matching the way a user would expect a drop to
 *  subdivide that specific tile. */
async function loadFiles(startLeaf, files) {
  let target = startLeaf;
  for (const file of files) {
    if (target.previewer) {
      const rect = target.el.getBoundingClientRect();
      const direction = rect.width >= rect.height ? "horizontal" : "vertical";
      target = splitLeaf(target, direction);
    }
    // Sequential: keeps Split.js state and layout mutations serialized,
    // and avoids N concurrent WASM workbook parses fighting for the
    // main thread.
    // eslint-disable-next-line no-await-in-loop
    await loadInto(target, file);
  }
}

async function loadInto(leaf, file) {
  // Tearing down a previous workbook before re-loading the slot keeps
  // canvas/worker resources from leaking when a user opens a new file
  // into a pane that already has one.
  if (leaf.previewer) {
    leaf.previewer.destroy();
    leaf.previewer = null;
  }
  resetTabbar(leaf);
  leaf.bodyEl.classList.remove("empty");
  leaf.bodyEl.innerHTML = "";
  leaf.nameEl.textContent = file.name;
  leaf.metaEl.textContent = "loading…";
  const started = performance.now();
  try {
    leaf.previewer = await createWorkbookPreviewerFromFile(leaf.bodyEl, file, {
      wasmBinaryUrl: `${ASSET_BASE}xlcore_wasm_bg.wasm`,
      workerUrl: `${ASSET_BASE}xlsxWorker.js`,
      onProgress: ({ label }) => (leaf.metaEl.textContent = label),
    });
    const dt = ((performance.now() - started) / 1000).toFixed(1);
    leaf.metaEl.textContent = `${leaf.previewer.layout.sheets.length} sheet(s) · ${dt}s`;
    populateTabbar(leaf);
    // Sheet/zoom changes can come from keyboard nav or programmatic
    // calls inside the previewer; mirror them in our tabbar.
    leaf.previewer.on("sheetchange", () => updateTabbar(leaf));
    leaf.previewer.on("zoomchange", () => updateTabbar(leaf));
  } catch (err) {
    leaf.metaEl.textContent = "failed";
    leaf.bodyEl.classList.add("empty");
    leaf.bodyEl.textContent = err?.message ?? String(err);
  }
}

function resetTabbar(leaf) {
  leaf.tabsEl.replaceChildren();
  leaf.zoomLabelEl.textContent = "100%";
  leaf.tabbarEl.classList.add("empty");
}

function populateTabbar(leaf) {
  leaf.tabsEl.replaceChildren();
  leaf.tabbarEl.classList.remove("empty");
  leaf.previewer.layout.sheets.forEach((sheet, index) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab";
    btn.dataset.index = String(index);
    btn.textContent = sheet.name;
    btn.setAttribute("role", "tab");
    btn.addEventListener("click", () => {
      leaf.previewer.setActiveSheet(index);
    });
    leaf.tabsEl.append(btn);
  });
  updateTabbar(leaf);
}

function updateTabbar(leaf) {
  if (!leaf.previewer) return;
  const state = leaf.previewer.getState();
  for (const btn of leaf.tabsEl.querySelectorAll(".tab")) {
    btn.classList.toggle("active", Number(btn.dataset.index) === state.activeSheetIndex);
  }
  leaf.zoomLabelEl.textContent = `${Math.round(state.zoom * 100)}%`;
}

// ----- split / merge ----------------------------------------------------

/** Replace `leaf` in the tree with a new Split node whose first child
 *  is `leaf` and whose second child is a fresh empty leaf. Split.js
 *  manages the drag-resize gutter between them. */
function splitLeaf(leaf, direction) {
  const newLeaf = createLeaf();
  const split = createSplitNode(direction, leaf, newLeaf);
  // IMPORTANT: replaceNode reads `leaf.parent` to find the slot it lives
  // in, so we must not have rewritten the parent pointers on the
  // children yet. createSplitNode therefore returns a split whose
  // children's `.parent` is still pointing at the original tree.
  replaceNode(leaf, split);
  leaf.parent = split;
  split.children[1].parent = split;
  instantiateSplit(split);
  return newLeaf;
}

function createSplitNode(direction, a, b) {
  const el = document.createElement("div");
  el.className = `split ${direction}`;
  const hostA = document.createElement("div");
  const hostB = document.createElement("div");
  hostA.className = "pane-host";
  hostB.className = "pane-host";
  hostA.append(a.el);
  hostB.append(b.el);
  el.append(hostA, hostB);
  /** @type {Split} */
  const node = {
    kind: "split", direction, el,
    children: [a, b], hosts: [hostA, hostB],
    instance: null, parent: null,
  };
  // Parent pointers on children are intentionally NOT set here; the
  // caller wires them up after replaceNode has used the old pointer.
  return node;
}

function instantiateSplit(node) {
  // Split.js wants the actual DOM children to size; we feed it the
  // wrapper hosts so leaves themselves stay flexible.
  node.instance = Split([node.hosts[0], node.hosts[1]], {
    direction: node.direction === "horizontal" ? "horizontal" : "vertical",
    sizes: [50, 50],
    minSize: 80,
    gutterSize: 4,
    snapOffset: 0,
    gutter: (_index, direction) => {
      const g = document.createElement("div");
      g.className = `gutter gutter-${direction}`;
      return g;
    },
    // Fire a redraw on each previewer in this split as the user drags,
    // otherwise the canvas keeps its old logical size until the next
    // ResizeObserver tick.
    onDrag: () => redrawSubtree(node),
    onDragEnd: () => redrawSubtree(node),
  });
}

function redrawSubtree(node) {
  if (!node) return;
  if (node.kind === "leaf") {
    node.previewer?.redraw();
    return;
  }
  for (const c of node.children) redrawSubtree(c);
}

function replaceNode(oldNode, newNode) {
  const parent = oldNode.parent;
  newNode.parent = parent;
  if (!parent) {
    root.replaceChildren(newNode.el);
    rootNode = newNode;
    return;
  }
  // Find which slot the old node was in.
  const idx = parent.children.indexOf(oldNode);
  parent.children[idx] = newNode;
  parent.hosts[idx].replaceChildren(newNode.el);
}

/** Re-home `source` relative to `target` based on a drop zone:
 *   - "center"           → swap the two leaves' positions in the tree.
 *   - "left"  / "right"  → wrap target in a new horizontal split with
 *                          source on the requested side.
 *   - "top"   / "bottom" → same but vertical.
 *  No-ops if source === target, if source is the root (nothing to
 *  detach), or if the move would be visually a no-op (source is
 *  already target's sibling on the same side with same direction). */
function moveLeaf(source, target, zone) {
  if (!source || !target || source === target) return;
  if (zone === "center") { swapLeaves(source, target); return; }
  if (!source.parent) return; // root can't be detached
  // After detaching source the tree shrinks; we then wrap target in a
  // new split with source. The order of operations matters: detach
  // first so `target.parent` reflects the post-detach state when we
  // compute its slot.
  detachLeaf(source);
  insertLeafAt(target, source, zone);
}

/** Remove `leaf` from its parent split, replacing the parent in the
 *  grandparent with the surviving sibling. Mirrors closeLeaf but
 *  preserves the previewer (we're going to re-insert it elsewhere). */
function detachLeaf(leaf) {
  const parent = leaf.parent;
  if (!parent) return;
  const sibling = parent.children[0] === leaf ? parent.children[1] : parent.children[0];
  parent.instance?.destroy();
  parent.instance = null;
  // Detach DOM nodes from their current hosts so replaceNode can re-home
  // the sibling cleanly.
  sibling.el.remove();
  sibling.parent = null;
  replaceNode(parent, sibling);
  leaf.el.remove();
  leaf.parent = null;
}

/** Insert `source` next to `target` on the given side, creating a new
 *  Split node in target's previous slot. */
function insertLeafAt(target, source, side) {
  const direction = (side === "left" || side === "right") ? "horizontal" : "vertical";
  const sourceFirst = side === "left" || side === "top";
  // Detach target from its current host so createSplitNode can place
  // both children into its fresh host wrappers.
  const targetParent = target.parent;
  const targetIdx = targetParent ? targetParent.children.indexOf(target) : -1;
  target.el.remove();
  source.el.remove();
  const a = sourceFirst ? source : target;
  const b = sourceFirst ? target : source;
  const split = createSplitNode(direction, a, b);
  // Plug the new split into the slot target used to live in (handles
  // root-replacement when target was root).
  if (!targetParent) {
    root.replaceChildren(split.el);
    rootNode = split;
    split.parent = null;
  } else {
    targetParent.children[targetIdx] = split;
    targetParent.hosts[targetIdx].replaceChildren(split.el);
    split.parent = targetParent;
  }
  a.parent = split;
  b.parent = split;
  instantiateSplit(split);
  // Both panes' previewers may need a redraw now that their containers
  // have new sizes; the resize observer will fire on its own tick but
  // a manual nudge eliminates a one-frame flash.
  source.previewer?.redraw();
  target.previewer?.redraw();
}

/** Swap two leaves' positions in the tree (each ends up where the other
 *  used to be). Both leaves must have parents (no root involvement). */
function swapLeaves(a, b) {
  if (a === b || !a.parent || !b.parent) return;
  const pa = a.parent, pb = b.parent;
  const ia = pa.children.indexOf(a);
  const ib = pb.children.indexOf(b);
  if (ia < 0 || ib < 0) return;
  // Pull both elements out of their hosts before re-homing — otherwise
  // appendChild would silently move the still-live sibling and we'd lose
  // track of one of them.
  a.el.remove();
  b.el.remove();
  pa.children[ia] = b;
  pb.children[ib] = a;
  pa.hosts[ia].replaceChildren(b.el);
  pb.hosts[ib].replaceChildren(a.el);
  a.parent = pb;
  b.parent = pa;
  a.previewer?.redraw();
  b.previewer?.redraw();
}

/** Close a leaf. If it's the root, replace it with a fresh empty leaf
 *  (a tile manager always shows at least one pane). Otherwise, replace
 *  the parent split with the surviving sibling, destroying the Split.js
 *  instance along the way. */
function closeLeaf(leaf) {
  leaf.previewer?.destroy();
  if (!leaf.parent) {
    const fresh = createLeaf();
    rootNode = fresh;
    root.replaceChildren(fresh.el);
    return;
  }
  const parent = leaf.parent;
  const sibling = parent.children[0] === leaf ? parent.children[1] : parent.children[0];
  parent.instance?.destroy();
  // Detach sibling from parent's host wrapper so replaceNode can re-home it.
  sibling.el.remove();
  sibling.parent = null;
  replaceNode(parent, sibling);
}

// ----- init -------------------------------------------------------------

function resetLayout() {
  if (rootNode) destroyTree(rootNode);
  rootNode = createLeaf();
  root.replaceChildren(rootNode.el);
}

function destroyTree(node) {
  if (node.kind === "leaf") {
    node.previewer?.destroy();
    return;
  }
  node.instance?.destroy();
  for (const c of node.children) destroyTree(c);
}

document.getElementById("reset").addEventListener("click", resetLayout);
resetLayout();
</script>
</body>
