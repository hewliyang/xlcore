<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xlsx-preview · CDN demo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; padding: 16px; }
      #preview { height: 80vh; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1 style="margin:0">xlsx-preview · CDN demo</h1>
    <p>No build step. Just open this file (or serve the folder statically).</p>
    <p><input id="picker" type="file" accept=".xlsx" /></p>
    <div id="preview"></div>

    <script type="module">
      import { createWorkbookPreviewer } from "https://esm.sh/@hewliyang/xlsx-preview@0.0.9/previewer";
      import initWasm, {
        extract_xlsx,
      } from "https://cdn.jsdelivr.net/npm/@hewliyang/xlsx-preview@0.0.9/dist/xlcore_wasm.js";

      const wasmReady = initWasm({
        module_or_path:
          "https://cdn.jsdelivr.net/npm/@hewliyang/xlsx-preview@0.0.9/dist/xlcore_wasm_bg.wasm",
      });
      const container = document.getElementById("preview");
      let previewer = null;

      document.getElementById("picker").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        await wasmReady;
        const bytes = new Uint8Array(await file.arrayBuffer());
        const { layout } = extract_xlsx(bytes, undefined);
        previewer?.destroy();
        previewer = createWorkbookPreviewer(container, layout);
      });
    </script>
  </body>
</html>
