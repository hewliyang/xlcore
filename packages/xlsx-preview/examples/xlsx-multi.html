<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xlcore multi-workbook example</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f7f8fa;
    color: #0f172a;
    font: 13px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
  }
  header {
    height: 36px;
    padding: 0 12px;
    background: #fff;
    border-bottom: 1px solid #e4e7eb;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header b { font-size: 12px; font-weight: 600; }
  header .hint { color: #64748b; font-size: 11.5px; }
  .file-picker {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 0 8px; height: 22px;
    border: 1px solid #d4d8de; border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 11px; font-weight: 500;
  }
  .file-picker:hover { background: #f4f6f8; }
  .file-picker input { position: absolute; left: -9999px; }
  main {
    display: grid;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    gap: 1px;
    background: #e4e7eb;
    min-height: 0;
  }
  .pane {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    background: #fff;
    min-width: 0;
    min-height: 0;
  }
  .pane-head {
    height: 28px;
    padding: 0 10px;
    border-bottom: 1px solid #e4e7eb;
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px;
    color: #64748b;
    background: #fafbfc;
  }
  .pane-head .name { color: #0f172a; font-weight: 600; }
  .pane-head .meta { color: #94a3b8; }
  .pane-body { min-width: 0; min-height: 0; position: relative; }
  .pane-body.empty {
    display: grid; place-items: center;
    color: #94a3b8; font-size: 12px;
    background: repeating-linear-gradient(45deg, #fafbfc 0 8px, #f4f6f8 8px 16px);
  }
  main.drop-target::after {
    content: "Drop .xlsx files anywhere";
    position: fixed; inset: 36px 0 0 0; z-index: 100;
    display: grid; place-items: center;
    background: rgba(79, 70, 229, 0.08);
    border: 2px dashed #4f46e5;
    color: #4f46e5; font-weight: 600; font-size: 14px;
    pointer-events: none;
  }
  /* Hide each previewer's built-in formula bar + tab strip — they all
     stack and we don't want the chrome doubled in a multi-pane layout. */
  .pane-body .xlcore-formula-bar,
  .pane-body .xlcore-tabs { display: none !important; }
</style>
</head>
<body>
<header>
  <b>xlcore · multi-workbook</b>
  <span class="hint">Open one or more .xlsx files — each lands in its own pane.</span>
  <label class="file-picker" for="picker">
    Open files…
    <input type="file" id="picker" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple>
  </label>
  <span class="hint" id="status">no workbooks loaded</span>
</header>
<main id="panes"></main>

<script type="module">
const REMOTE_CDN = "https://cdn.jsdelivr.net/npm/@hewliyang/xlsx-preview@0.0.1/dist/";
let ASSET_BASE = "../dist/";
let createWorkbookPreviewerFromFile;
try {
  ({ createWorkbookPreviewerFromFile } = await import(`../dist/browser-loader.js?v=${Date.now()}`));
} catch (error) {
  console.warn("Local renderer failed; falling back to CDN", error);
  ASSET_BASE = REMOTE_CDN;
  ({ createWorkbookPreviewerFromFile } = await import(`${REMOTE_CDN}browser-loader.js`));
}

const panes = document.getElementById("panes");
const status = document.getElementById("status");
const picker = document.getElementById("picker");

/** Each entry: { previewer, paneEl, file }. Tracking them lets us
 *  destroy/replace on demand and resize the grid template. */
const instances = [];

function relayout() {
  document.documentElement.style.setProperty("--cols", String(Math.max(1, instances.length)));
}

async function addWorkbook(file) {
  const pane = document.createElement("section");
  pane.className = "pane";
  const head = document.createElement("div");
  head.className = "pane-head";
  const nameEl = document.createElement("span");
  nameEl.className = "name";
  nameEl.textContent = file.name;
  const metaEl = document.createElement("span");
  metaEl.className = "meta";
  metaEl.textContent = "loading…";
  const close = document.createElement("button");
  close.textContent = "✕";
  close.title = "Close workbook";
  close.style.cssText = "margin-left:auto;border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:3px;";
  close.onmouseenter = () => (close.style.color = "#dc2626");
  close.onmouseleave = () => (close.style.color = "#94a3b8");
  head.append(nameEl, metaEl, close);
  const body = document.createElement("div");
  body.className = "pane-body";
  pane.append(head, body);
  panes.append(pane);

  const entry = { previewer: null, paneEl: pane, file };
  instances.push(entry);
  relayout();
  setStatus();

  close.onclick = () => {
    entry.previewer?.destroy();
    pane.remove();
    const i = instances.indexOf(entry);
    if (i >= 0) instances.splice(i, 1);
    relayout();
    setStatus();
  };

  const started = performance.now();
  try {
    entry.previewer = await createWorkbookPreviewerFromFile(body, file, {
      wasmBinaryUrl: `${ASSET_BASE}xlcore_wasm_bg.wasm`,
      workerUrl: `${ASSET_BASE}xlsxWorker.js`,
      onProgress: ({ label }) => (metaEl.textContent = label),
    });
    const dt = ((performance.now() - started) / 1000).toFixed(1);
    metaEl.textContent = `${entry.previewer.layout.sheets.length} sheet(s) · ${dt}s`;
    // Each previewer runs its own interactivity; selection is per-pane.
    setStatus();
  } catch (err) {
    metaEl.textContent = "failed";
    body.classList.add("empty");
    body.textContent = err && err.message ? err.message : String(err);
  }
}

function setStatus() {
  status.textContent = instances.length
    ? `${instances.length} workbook${instances.length === 1 ? "" : "s"} open`
    : "no workbooks loaded";
}

async function loadFiles(files) {
  // Load in parallel — each call spins its own one-shot Worker for the
  // OOXML extraction, then attaches an isolated previewer to its pane.
  await Promise.all(files.map((f) => addWorkbook(f)));
}

picker.addEventListener("change", async () => {
  const files = Array.from(picker.files ?? []);
  picker.value = "";
  await loadFiles(files);
});

// Page-wide drop zone: dropping anywhere outside an existing previewer
// adds a new pane per file. Filters down to .xlsx so accidental drags
// of unrelated files don't spam empty panes.
let dragDepth = 0;
const isXlsx = (f) => f && (/\.xlsx$/i.test(f.name) || f.type === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
window.addEventListener("dragenter", (e) => {
  if (!e.dataTransfer?.types?.includes("Files")) return;
  e.preventDefault();
  dragDepth++;
  panes.classList.add("drop-target");
});
window.addEventListener("dragover", (e) => {
  if (!e.dataTransfer?.types?.includes("Files")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("dragleave", () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) panes.classList.remove("drop-target");
});
window.addEventListener("drop", async (e) => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  dragDepth = 0;
  panes.classList.remove("drop-target");
  const files = Array.from(e.dataTransfer.files).filter(isXlsx);
  if (files.length) await loadFiles(files);
});
</script>
</body>
</html>
