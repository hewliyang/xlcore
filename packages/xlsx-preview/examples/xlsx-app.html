<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xlcore Excel app example</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  /* --- design tokens ------------------------------------------------ */
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-muted: #f4f6f8;
    --border: #e4e7eb;
    --border-strong: #d4d8de;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --accent-strong: #4338ca;
    --good: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --code-bg: #fbfaf6;
    --code-border: #ece8d8;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --radius: 6px;
    --radius-sm: 4px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-feature-settings: "cv11", "ss03";
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
  }

  /* --- app bar ------------------------------------------------------ */
  header {
    min-width: 0;
    padding: 0 8px;
    height: 34px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .name-box {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 8px;
    min-width: 64px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .fx-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-style: italic;
    color: var(--text-dim);
  }
  .formula-box {
    flex: 1 1 auto;
    min-width: 0;
    height: 22px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .formula-box:empty::before { content: ""; }
  .file-picker {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    height: 22px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    flex: none;
  }
  .file-picker:hover { background: var(--surface-muted); border-color: var(--text-dim); }
  .file-picker svg { width: 12px; height: 12px; }
  .file-picker input { position: absolute; left: -9999px; }
  #status {
    color: var(--text-muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    flex: none;
    max-width: 240px;
  }
  #status .status-pill {
    display: inline-block;
    padding: 0 5px;
    border-radius: 3px;
    background: var(--surface-muted);
    color: var(--text);
    font-weight: 500;
    margin-right: 4px;
  }
  header .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
    flex: none;
  }
  #panel-toggle {
    width: 22px;
    height: 22px;
    padding: 0;
    flex: none;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    transition: background 0.12s;
  }
  #panel-toggle:hover { background: var(--surface-muted); color: var(--text); }

  /* --- main grid: preview + aside ----------------------------------- */
  main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
  }
  body.panel-collapsed main { grid-template-columns: minmax(0, 1fr) 0; }
  #preview {
    min-width: 0;
    min-height: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    position: relative;
  }
  body.panel-collapsed #preview { border-right: 0; }
  #preview.drop-target::after {
    content: "Drop to load .xlsx";
    position: absolute; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: rgba(79, 70, 229, 0.08);
    border: 2px dashed var(--accent);
    color: var(--accent); font-weight: 600; font-size: 14px;
    pointer-events: none;
  }
  /* Hide the previewer's built-in sheet-tab strip and formula bar —
     we render compact equivalents in the app bar / footer. */
  #preview .xlcore-tabs { display: none !important; }
  #preview .xlcore-formula-bar { display: none !important; }

  /* --- inspector aside --------------------------------------------- */
  aside {
    min-height: 0;
    overflow: auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  body.panel-collapsed aside { overflow: hidden; }
  body.panel-collapsed aside > * { display: none; }

  /* Collapsible section */
  details.section {
    border-bottom: 1px solid var(--border);
  }
  details.section[open] { background: var(--surface); }
  details.section > summary {
    list-style: none;
    cursor: pointer;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    user-select: none;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before {
    content: "";
    width: 0;
    height: 0;
    border: 3px solid transparent;
    border-left-color: var(--text-dim);
    transform: rotate(0deg);
    transition: transform 0.14s;
    margin-right: 2px;
  }
  details.section[open] > summary::before { transform: rotate(90deg); }
  details.section > summary:hover { color: var(--text); }
  details.section .body {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Key/value rows */
  .kv {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 4px 12px;
    align-items: baseline;
    padding: 4px 0;
    font-size: 12px;
  }
  .kv dt {
    color: var(--text-muted);
    font-weight: 400;
    margin: 0;
  }
  .kv dd {
    margin: 0;
    color: var(--text);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kv dd.mono { font-family: var(--font-mono); font-size: 11.5px; }

  /* Form controls */
  .row { display: flex; gap: 6px; align-items: center; min-width: 0; }
  button, select, input[type=text], input[type=number] {
    height: 28px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  button { padding: 0 10px; cursor: pointer; white-space: nowrap; font-weight: 500; }
  button:hover { background: var(--surface-muted); }
  button:active { background: var(--border); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button:disabled, select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
  select, input[type=text], input[type=number] { min-width: 0; padding: 0 8px; }
  input[type=text]:focus, input[type=number]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #address { flex: 1; font-family: var(--font-mono); font-size: 11.5px; }
  #sheet-select { width: 100%; }

  /* Chip-style quick jumps */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-muted);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  /* Syntax-highlighted state block (light) */
  .state {
    margin: 0;
    padding: 10px 12px;
    overflow: auto;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: #374151;
    white-space: pre;
  }
  .state .k { color: #6d28d9; }     /* keys: purple */
  .state .s { color: #047857; }     /* strings: green */
  .state .n { color: #b45309; }     /* numbers: amber */
  .state .p { color: var(--text-dim); }   /* punctuation */

  /* --- sheet tab bar (footer) -------------------------------------- */
  footer.tabbar {
    height: 28px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: stretch;
    min-width: 0;
  }
  .tabbar .tabs {
    flex: 1 1 auto;
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    padding: 0 6px;
    min-width: 0;
  }
  .tabbar .tabs::-webkit-scrollbar { height: 6px; }
  .tabbar .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .tabbar .tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 100%;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 0;
    transition: color 0.12s, background 0.12s;
  }
  .tabbar .tab:hover { color: var(--text); background: var(--surface-muted); }
  .tabbar .tab.active { color: var(--accent-strong); font-weight: 600; }
  .tabbar .tab.active::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px; bottom: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }
  .tabbar .right {
    flex: none;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    border-left: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .tabbar .icon-btn {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tabbar .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
  .tabbar #zoom-label {
    min-width: 38px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text);
  }

  /* --- loading overlay -------------------------------------------- */
  #loading {
    position: fixed;
    inset: 34px 300px 28px 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: rgba(247, 248, 250, 0.9);
    backdrop-filter: blur(2px);
  }
  body.panel-collapsed #loading { right: 0; }
  #loading[hidden] { display: none; }
  .loading-box {
    min-width: 280px;
    padding: 18px 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  }
  .loading-title {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .loading-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 999px;
    animation: spin 0.8s linear infinite;
    flex: none;
  }
  #loading-elapsed { margin-top: 8px; font-size: 11px; color: var(--text-dim); }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) auto; }
    body.panel-collapsed main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 0; }
    #preview { border-right: 0; border-bottom: 1px solid var(--border); }
    body.panel-collapsed #preview { border-bottom: 0; }
    aside { max-height: 45vh; }
    #loading { inset: 34px 0 calc(45vh + 28px) 0; }
    body.panel-collapsed #loading { inset: 34px 0 28px 0; }
  }
</style>
</head>
<body>
<header>
  <label class="file-picker" for="picker">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span>Open</span>
    <input type="file" id="picker" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  </label>
  <span class="sep"></span>
  <span class="name-box" id="name-box">—</span>
  <span class="fx-label">fx</span>
  <span class="formula-box" id="formula-box"></span>
  <span class="sep"></span>
  <span id="status">Load an .xlsx file to begin</span>
  <button id="panel-toggle" type="button" aria-label="Collapse side panel" aria-expanded="true" title="Toggle inspector">›</button>
</header>

<main>
  <div id="preview"></div>
  <aside>
    <details class="section" open>
      <summary>Selection</summary>
      <div class="body">
        <dl class="kv" id="sel-kv">
          <dt>Active</dt><dd class="mono" id="sel-active">—</dd>
          <dt>Range</dt><dd class="mono" id="sel-range">—</dd>
          <dt>Size</dt><dd id="sel-size">—</dd>
        </dl>
        <div class="row">
          <input id="address" type="text" value="C5" aria-label="Cell address" placeholder="e.g. F12 or B2:E8">
          <button id="go-cell" class="primary">Go</button>
        </div>
        <div class="chips" id="quick-chips">
          <button class="chip" data-cell="A1">A1</button>
          <button class="chip" data-cell="C5">C5</button>
          <button class="chip" data-cell="F12">F12</button>
          <button class="chip" data-range="B2:E8">B2:E8</button>
        </div>
      </div>
    </details>

    <details class="section" open>
      <summary>Viewport</summary>
      <div class="body">
        <div class="grid2">
          <button id="scroll-active">Scroll active</button>
          <button id="reset-view">Reset view</button>
        </div>
      </div>
    </details>

    <details class="section">
      <summary>Live state</summary>
      <div class="body">
        <pre id="state" class="state">No workbook loaded</pre>
      </div>
    </details>
  </aside>
</main>

<footer class="tabbar">
  <div class="tabs" id="sheet-tabs" role="tablist" aria-label="Sheets"></div>
  <div class="right">
    <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
  </div>
</footer>

<div id="loading" role="status" aria-live="polite" hidden>
  <div class="loading-box">
    <p class="loading-title">Loading workbook…</p>
    <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span id="loading-stage">Loading preview</span></div>
    <div id="loading-elapsed">0.0s elapsed</div>
  </div>
</div>

<script type="module">
// Examples load the renderer from a local `../dist/` build when run under
// `pnpm preview`, and fall back to the published npm package on jsdelivr
// when the HTML is opened standalone (e.g. hosted on Pages / file://).
const REMOTE_CDN = "https://cdn.jsdelivr.net/npm/@hewliyang/xlsx-preview@0.0.4/dist/";
let ASSET_BASE = "../dist/";
let createWorkbookPreviewerFromFile;
try {
  ({ createWorkbookPreviewerFromFile } = await import(`../dist/browserLoader.js?v=${Date.now()}`));
} catch (error) {
  console.warn("Local renderer failed to load; falling back to CDN build", error);
  ASSET_BASE = REMOTE_CDN;
  ({ createWorkbookPreviewerFromFile } = await import(`${REMOTE_CDN}browserLoader.js`));
}
const picker = document.getElementById("picker");
const status = document.getElementById("status");
const previewRoot = document.getElementById("preview");
const panelToggle = document.getElementById("panel-toggle");
const sheetTabs = document.getElementById("sheet-tabs");
const zoomLabel = document.getElementById("zoom-label");
const nameBox = document.getElementById("name-box");
const formulaBox = document.getElementById("formula-box");
const stateBox = document.getElementById("state");
const address = document.getElementById("address");
const loading = document.getElementById("loading");
const loadingStage = document.getElementById("loading-stage");
const loadingElapsed = document.getElementById("loading-elapsed");

const selActive = document.getElementById("sel-active");
const selRange = document.getElementById("sel-range");
const selSize = document.getElementById("sel-size");

let previewer = null;
let elapsedTimer = null;

panelToggle.addEventListener("click", () => {
  const collapsed = document.body.classList.toggle("panel-collapsed");
  panelToggle.textContent = collapsed ? "‹" : "›";
  panelToggle.setAttribute("aria-label", collapsed ? "Expand side panel" : "Collapse side panel");
  panelToggle.setAttribute("aria-expanded", String(!collapsed));
  requestAnimationFrame(() => previewer?.redraw());
});

function setStatus(text, pill) {
  status.textContent = "";
  if (pill) {
    const p = document.createElement("span");
    p.className = "status-pill";
    p.textContent = pill;
    status.appendChild(p);
  }
  status.appendChild(document.createTextNode(text));
}

function setLoadingStage(text) {
  loadingStage.textContent = text;
  setStatus(text);
}

function startLoading() {
  const started = performance.now();
  loading.hidden = false;
  clearInterval(elapsedTimer);
  loadingElapsed.textContent = "0.0s elapsed";
  elapsedTimer = setInterval(() => {
    loadingElapsed.textContent = `${((performance.now() - started) / 1000).toFixed(1)}s elapsed`;
  }, 100);
  return started;
}

function finishLoading() {
  clearInterval(elapsedTimer);
  elapsedTimer = null;
  loading.hidden = true;
}

/** Tiny JSON syntax highlighter for the live-state block. */
function highlightJSON(text) {
  // Escape HTML first.
  const esc = text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  return esc
    .replace(/("(?:\\.|[^"\\])*")(\s*:)/g, '<span class="k">$1</span><span class="p">$2</span>')
    .replace(/: ("(?:\\.|[^"\\])*")/g, ': <span class="s">$1</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="n">$1</span>')
    .replace(/([{}\[\],])/g, '<span class="p">$1</span>');
}

// Cell kinds (must mirror columnar.ts KIND_NAMES).
const CELL_KIND = ["n", "s", "inline", "b", "e", "str", "f"];

function activeCellDisplay(sheet, layout, r, c) {
  const meta = sheet.decodedRowMeta;
  const cells = sheet.decodedCells;
  if (!meta || !cells) return "";
  const m = meta.byIndex?.get(r);
  if (m === undefined) return "";
  const start = cells.rowPtr[m] ?? 0;
  const end = cells.rowPtr[m + 1] ?? cells.count;
  // Binary search by column within the row's cell range.
  let lo = start, hi = end - 1, idx = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const col = cells.c[mid] ?? 0;
    if (col === c) { idx = mid; break; }
    if (col < c) lo = mid + 1; else hi = mid - 1;
  }
  if (idx < 0) return "";
  const formulaIdx = cells.formulaIdx?.[idx] ?? -1;
  if (formulaIdx >= 0) {
    const f = sheet.formulaPool?.[formulaIdx] ?? "";
    return f ? (f.startsWith("=") ? f : `=${f}`) : "";
  }
  const valueIdx = cells.valueIdx?.[idx] ?? -1;
  const raw = valueIdx >= 0 ? sheet.valuePool?.[valueIdx] : undefined;
  const kind = CELL_KIND[cells.kind?.[idx] ?? 0] ?? "n";
  if (kind === "s" && raw !== undefined) {
    const sst = layout.sharedStrings?.[Number(raw)] ?? "";
    return sst;
  }
  if (kind === "inline") {
    const runsIdx = cells.runsIdx?.[idx] ?? -1;
    if (runsIdx >= 0) {
      const runs = sheet.inlineRuns?.[runsIdx] ?? [];
      return runs.map((run) => run.text ?? "").join("");
    }
  }
  return raw ?? "";
}

function renderState() {
  if (!previewer) {
    stateBox.textContent = "No workbook loaded";
    selActive.textContent = "—";
    selRange.textContent = "—";
    selSize.textContent = "—";
    zoomLabel.textContent = "100%";
    nameBox.textContent = "—";
    formulaBox.textContent = "";
    return;
  }
  const state = previewer.getState();
  const sheet = previewer.getActiveSheet();
  const activeAddr = formatCell(state.activeCell.r, state.activeCell.c);
  const rangeAddr = formatSelection(state.selection);
  const rows = state.selection.r2 - state.selection.r1 + 1;
  const cols = state.selection.c2 - state.selection.c1 + 1;
  const size = rows === 1 && cols === 1 ? "1 cell" : `${rows} × ${cols} (${rows * cols} cells)`;
  const zoomPct = `${Math.round(state.zoom * 100)}%`;

  selActive.textContent = activeAddr;
  selRange.textContent = rangeAddr;
  selSize.textContent = size;
  zoomLabel.textContent = zoomPct;
  // Name box shows range when multi-cell (Excel convention shows the size,
  // e.g. "3R x 4C"). For a single cell, show the address.
  nameBox.textContent = rows === 1 && cols === 1 ? activeAddr : `${rows}R×${cols}C`;
  try {
    formulaBox.textContent = String(
      activeCellDisplay(sheet, previewer.layout, state.activeCell.r, state.activeCell.c) ?? "",
    );
  } catch {
    formulaBox.textContent = "";
  }

  // Reflect active sheet in the tab strip.
  const activeIndex = state.activeSheetIndex;
  for (const btn of sheetTabs.querySelectorAll(".tab")) {
    btn.classList.toggle("active", Number(btn.dataset.index) === activeIndex);
  }

  const payload = {
    sheet: sheet.name,
    sheetIndex: state.activeSheetIndex,
    activeCell: activeAddr,
    selection: rangeAddr,
    zoom: zoomPct,
  };
  stateBox.innerHTML = highlightJSON(JSON.stringify(payload, null, 2));
}

function populateSheets() {
  sheetTabs.replaceChildren();
  if (!previewer) return;
  previewer.layout.sheets.forEach((sheet, index) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab";
    btn.dataset.index = String(index);
    btn.textContent = sheet.name;
    btn.setAttribute("role", "tab");
    btn.addEventListener("click", () => {
      requirePreviewer().setActiveSheet(index);
      renderState();
    });
    sheetTabs.append(btn);
  });
}

function parseCell(value) {
  const match = String(value).trim().match(/^([A-Za-z]+)(\d+)$/);
  if (!match) throw new Error(`Invalid cell address: ${value}`);
  return { c: colNumber(match[1]), r: Number(match[2]) };
}

function parseRange(value) {
  const [a, b] = String(value).split(":");
  const start = parseCell(a);
  const end = parseCell(b || a);
  return { r1: start.r, c1: start.c, r2: end.r, c2: end.c };
}

function colNumber(label) {
  let n = 0;
  for (const ch of label.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n;
}

function colLabel(n) {
  let out = "";
  let cur = n;
  while (cur > 0) {
    const r = (cur - 1) % 26;
    out = String.fromCharCode(65 + r) + out;
    cur = Math.floor((cur - 1) / 26);
  }
  return out;
}

function formatCell(r, c) {
  return `${colLabel(c)}${r}`;
}

function formatSelection(selection) {
  const start = formatCell(selection.r1, selection.c1);
  const end = formatCell(selection.r2, selection.c2);
  return start === end ? start : `${start}:${end}`;
}

function requirePreviewer() {
  if (!previewer) throw new Error("Load a workbook first");
  return previewer;
}

function goFromAddress() {
  try {
    const raw = address.value.trim();
    if (raw.includes(":")) {
      requirePreviewer().selectRange(parseRange(raw), { scroll: true });
    } else {
      const cell = parseCell(raw);
      requirePreviewer().selectCell(cell.r, cell.c, { scroll: true });
    }
    renderState();
  } catch (error) {
    setStatus(error.message || String(error));
  }
}

async function loadWorkbookFile(file) {
  if (!file) return;
  const started = startLoading();
  try {
    previewer?.destroy();
    previewRoot.replaceChildren();
    previewer = await createWorkbookPreviewerFromFile(previewRoot, file, {
      wasmBinaryUrl: `${ASSET_BASE}xlcore_wasm_bg.wasm`,
      workerUrl: `${ASSET_BASE}xlsxWorker.js`,
      onProgress: ({ label }) => setLoadingStage(label),
    });
    window.xlcorePreviewer = previewer;
    previewer.on("selectionchange", renderState);
    previewer.on("sheetchange", renderState);
    previewer.on("zoomchange", renderState);
    populateSheets();
    renderState();
    requestAnimationFrame(finishLoading);
    setStatus(
      `${previewer.layout.sheets.length} sheet(s) · ${((performance.now() - started) / 1000).toFixed(1)}s`,
      file.name,
    );
  } catch (error) {
    console.error(error);
    finishLoading();
    setStatus(error && error.message ? error.message : String(error));
  }
}

picker.addEventListener("change", () => {
  const file = picker.files && picker.files[0];
  loadWorkbookFile(file);
  picker.value = "";
});

// Drag-and-drop on the preview pane. Accepts a single .xlsx; extra
// files are ignored. Drops outside the pane are swallowed at window
// level so the browser doesn't navigate away.
(() => {
  let depth = 0;
  const isXlsx = (f) =>
    f && (/\.xlsx$/i.test(f.name) || f.type === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  previewRoot.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault();
    depth++;
    previewRoot.classList.add("drop-target");
  });
  previewRoot.addEventListener("dragover", (e) => {
    if (!e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  previewRoot.addEventListener("dragleave", () => {
    depth = Math.max(0, depth - 1);
    if (depth === 0) previewRoot.classList.remove("drop-target");
  });
  previewRoot.addEventListener("drop", (e) => {
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    depth = 0;
    previewRoot.classList.remove("drop-target");
    const file = Array.from(e.dataTransfer.files).find(isXlsx);
    if (file) loadWorkbookFile(file);
    else setStatus("not an .xlsx file");
  });
  // Page-wide swallow so accidental drops elsewhere don't navigate.
  window.addEventListener("dragover", (e) => {
    if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
  });
  window.addEventListener("drop", (e) => {
    if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
  });
})();

document.getElementById("go-cell").addEventListener("click", goFromAddress);
address.addEventListener("keydown", (e) => { if (e.key === "Enter") goFromAddress(); });

document.querySelectorAll("[data-cell]").forEach((button) => {
  button.addEventListener("click", () => {
    const cell = parseCell(button.dataset.cell);
    address.value = button.dataset.cell;
    requirePreviewer().selectCell(cell.r, cell.c, { scroll: true });
    renderState();
  });
});

document.querySelectorAll("[data-range]").forEach((button) => {
  button.addEventListener("click", () => {
    address.value = button.dataset.range;
    requirePreviewer().selectRange(parseRange(button.dataset.range), { scroll: true });
    renderState();
  });
});

document.getElementById("zoom-out").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setZoom(p.getZoom() - 0.25);
  renderState();
});

document.getElementById("zoom-in").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setZoom(p.getZoom() + 0.25);
  renderState();
});

document.getElementById("scroll-active").addEventListener("click", () => {
  const p = requirePreviewer();
  const cell = p.getActiveCell();
  p.scrollToCell(cell.r, cell.c);
  renderState();
});

document.getElementById("reset-view").addEventListener("click", () => {
  const p = requirePreviewer();
  p.setActiveSheet(0);
  p.setZoom(1);
  p.selectCell(1, 1, { scroll: true });
  renderState();
});
</script>
</body>
</html>
