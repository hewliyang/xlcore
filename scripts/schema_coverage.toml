# Schema-coverage manifest for scripts/schema_diff.py --check.
#
# Each [[pair]] is an (ooxmlsdk CT_* struct, xlcore-types DTO) we have opened up.
# Per field the diff assigns: covered | flattened (n/m) | derived | excluded |
# MISSING. Only MISSING counts as a gap; --check fails (non-zero) on any MISSING
# field that is not declared here or via a DTO `schema-excluded:` doc annotation.
#
#   ns       namespace prefix to disambiguate same-named structs (c/x/a)
#   derived  fields the API computes internally (axis ids, refs, order, index)
#   excluded fields intentionally deferred for this pair (extLst is intrinsic)
#   aliases  sdk leaf-tag/field -> dto field, for semantic renames
#
# Deferrals shared by a DTO live in its doc comment (`schema-excluded:`); per-pair
# specifics live below. Every entry is a deliberate decision.

# --- chart axes -------------------------------------------------------------
[[pair]]
sdk = "ValueAxis"
dto = "ChartAxisPatch"
ns = "c"
derived = ["axId", "axPos", "crossAx"]
aliases = { delete = "hidden", numFmt = "number_format", orientation = "reversed", txPr = "label_rotation" }

[[pair]]
sdk = "CategoryAxis"
dto = "ChartAxisPatch"
ns = "c"
derived = ["axId", "axPos", "crossAx"]
aliases = { delete = "hidden", numFmt = "number_format", orientation = "reversed", txPr = "label_rotation" }

